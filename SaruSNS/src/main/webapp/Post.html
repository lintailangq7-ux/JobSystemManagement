<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投稿作成</title>
<style>
    /* ヘッダー全体 */
    .post-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid #e5e7eb;
        background-color: #ffffff;
    }

    /* 戻るボタン */
    .back-button {
        width: 40px;
        height: 40px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background-color: #ffffff;
        color: #2563eb;
        font-size: 22px;
        cursor: pointer;
    }

    /* タイトル */
    .post-header h1 {
        margin: 0;
        font-size: 24px;
        color: #222222;
        white-space: nowrap;
    }

    /* 投稿ボタンを右側に配置 */
    .submit-button {
        margin-left: auto;
        padding: 10px 22px;
        border: none;
        border-radius: 8px;
        background-color: #2563eb;
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .submit-button:hover {
        background-color: #1d4ed8;
    }
	.text-input-section {
	    margin: 20px 0;
	}

	.text-input-section > label {
	    display: block;
	    margin-bottom: 8px;
	    font-weight: bold;
	}

	.text-area-container {
	    border: 1px solid #cbd5e1;
	    border-radius: 10px;
	    padding: 12px;
	    background-color: #ffffff;
	}

	.text-area-container textarea {
	    display: block;
	    width: 100%;
	    min-height: 140px;
	    padding: 8px;
	    border: none;
	    outline: none;
	    box-sizing: border-box;
	    resize: vertical;
	    font-size: 16px;
	    font-family: inherit;
	}

	.hashtag-area {
	    display: flex;
	    justify-content: flex-end;
	    margin-top: 8px;
	}

	.hashtag-button {
	    padding: 8px 12px;
	    border: 1px solid #93b8f5;
	    border-radius: 6px;
	    background-color: #eff6ff;
	    color: #2563eb;
	    cursor: pointer;
	    font-size: 14px;
	}

	.hashtag-button:hover {
	    background-color: #dbeafe;
	}

	.hashtag-input-area {
	    margin-top: 12px;
	    padding-top: 12px;
	    border-top: 1px solid #e5e7eb;
	}

	.hashtag-input-area label {
	    display: block;
	    margin-bottom: 8px;
	    font-size: 14px;
	    font-weight: bold;
	}

	.hashtag-input-row {
	    display: flex;
	    flex-wrap: wrap;
	    gap: 8px;
	}

	.hashtag-input-row input {
	    flex: 1;
	    min-width: 120px;
	    padding: 9px;
	    border: 1px solid #cbd5e1;
	    border-radius: 6px;
	    font-size: 14px;
	}

	.hashtag-input-row button {
	    padding: 8px 12px;
	    border: 1px solid #93b8f5;
	    border-radius: 6px;
	    background-color: #eff6ff;
	    color: #2563eb;
	    cursor: pointer;
	}

	.hashtag-input-row button:hover {
	    background-color: #dbeafe;
	}

	.hashtag-input-area[hidden] {
	    display: none;
	}

	/* 画面中央の背景 */
	.hashtag-modal {
	    position: fixed;
	    inset: 0;
	    z-index: 1000;
	    display: flex;
	    align-items: center;
	    justify-content: center;
	    padding: 20px;
	    background: rgba(15, 23, 42, 0.45);
	    box-sizing: border-box;
	}

	.hashtag-modal[hidden] {
	    display: none;
	}

	/* 入力枠 */
	.hashtag-dialog {
	    position: relative;
	    width: 100%;
	    max-width: 360px;
	    padding: 24px;
	    border-radius: 14px;
	    background: #ffffff;
	    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
	    box-sizing: border-box;
	}

	.hashtag-dialog h2 {
	    margin: 0 30px 20px 0;
	    font-size: 20px;
	    color: #222222;
	}

	.hashtag-dialog label {
	    display: block;
	    margin-bottom: 8px;
	    font-size: 14px;
	    font-weight: bold;
	}

	.hashtag-close {
	    position: absolute;
	    top: 12px;
	    right: 12px;
	    width: 32px;
	    height: 32px;
	    border: none;
	    border-radius: 6px;
	    background: #f1f5f9;
	    color: #475569;
	    font-size: 24px;
	    cursor: pointer;
	}

	.hashtag-input-row input {
	    width: 100%;
	    padding: 12px;
	    border: 1px solid #cbd5e1;
	    border-radius: 8px;
	    box-sizing: border-box;
	    font-size: 16px;
	}

	.hashtag-confirm {
	    width: 100%;
	    margin-top: 16px;
	    padding: 12px;
	    border: none;
	    border-radius: 8px;
	    background: #2563eb;
	    color: #ffffff;
	    font-size: 16px;
	    cursor: pointer;
	}


	/* 下部メニュー */
	.bottom-menu {
	    position: fixed;
	    bottom: 0;
	    left: 0;
	    width: 100%;
	    display: flex;
	    justify-content: space-around;
	    align-items: center;
	    padding: 10px 0;
	    background-color: #ffffff;
	    border-top: 1px solid #e5e7eb;
	    box-sizing: border-box;
	    z-index: 100;
	}

	.bottom-menu a {
	    display: flex;
	    justify-content: center;
	    align-items: center;
	    width: 48px;
	    height: 44px;
	    color: #2563eb;
	    text-decoration: none;
	    font-size: 30px;
	    border-radius: 8px;
	}

	.bottom-menu a:hover {
	    background-color: #eff6ff;
	}

	.section {
	  margin: 16px;
	  padding: 16px;
	  border: 1px solid #e2eaf5;
	  border-radius: 12px;
	  background: #fff;
	}

	.section h2 {
	  margin-top: 0;
	  font-size: 17px;
	}

	.upload-button,
	.audio-Input,
	.audio-controls button {
	  display: inline-block;
	  padding: 10px 14px;
	  border: 1px solid #bfdbfe;
	  border-radius: 8px;
	  background: #eff6ff;
	  color: #1d4ed8;
	  cursor: pointer;
	}

	.image-list {
	  display: grid;
	  grid-template-columns: repeat(2, minmax(0, 1fr));
	  gap: 12px;
	  margin-top: 14px;
	}

	.image-item img {
	  width: 100%;
	  aspect-ratio: 1;
	  object-fit: cover;
	  border-radius: 8px;
	}

	.audio-item {
	  margin-top: 12px;
	  padding: 12px;
	  background: #f8fafc;
	  border: 1px solid #e2e8f0;
	  border-radius: 8px;
	}

	.audio-item audio {
	  display: block;
	  width: 100%;
	  margin: 10px 0;
	}

	.remove-button {
	  padding: 6px 10px;
	  border: none;
	  border-radius: 6px;
	  background: #fee2e2;
	  color: #b91c1c;
	  cursor: pointer;
	}

	.audio-controls {
	  display: flex;
	  flex-wrap: wrap;
	  gap: 8px;
	}


	/* 画像・音声の共通デザイン */
	.image-list {
	    display: grid;
	    grid-template-columns: repeat(2, minmax(0, 1fr));
	    gap: 12px;
	    margin-top: 14px;
	}

	.image-item img {
	    width: 100%;
	    aspect-ratio: 1;
	    object-fit: cover;
	    border-radius: 8px;
	}

	.image-item .remove-button {
	    margin-top: 6px;
	}

	.audio-item {
	    margin-top: 12px;
	    padding: 12px;
	    background: #f8fafc;
	    border: 1px solid #e2e8f0;
	    border-radius: 8px;
	}

	.audio-item audio {
	    display: block;
	    width: 100%;
	    margin: 10px 0;
	}

	.audio-controls {
	    display: flex;
	    flex-wrap: wrap;
	    gap: 8px;
	}

	.audio-controls button {
	    padding: 10px 14px;
	    border: 1px solid #bfdbfe;
	    border-radius: 8px;
	    background: #eff6ff;
	    color: #1d4ed8;
	    cursor: pointer;
	}

	.audio-controls button:disabled {
	    opacity: 0.5;
	    cursor: not-allowed;
	}

	.remove-button {
	    padding: 6px 10px;
	    border: none;
	    border-radius: 6px;
	    background: #fee2e2;
	    color: #b91c1c;
	    cursor: pointer;
	}

</style>
</head>
<body>
	<!-- ヘッダー -->
	   <header class="post-header">
	       <button type="button" class="back-button" onclick="history.back()" aria-label="戻る">←</button>
	       <h1>投稿作成</h1>
	       <button type="submit" form="postForm" class="submit-button">投稿</button>
	   </header>

	   <main>
	       <form id="postForm">

	           <!-- アカウント情報 -->
	           <section>
	               <div class="account-info">
					<img id="accountIcon"
					     src="images/default-icon.png"
	                     alt ="プロフィール画像"
						 class="account-icon">
	                   <span id="accountName">アカウント名</span>
	               </div>

	               <label for="visibility">公開範囲</label>
	               <select id="visibility" name="visibility">
	                   <option value="public">全体に公開</option>
	                   <option value="followers">フォロワーのみ</option>
	                   <option value="private">自分のみ</option>
	               </select>
	           </section>

	           <!-- テキスト入力 -->
	           <section>
				<div class="text-input-section">
	               <label for="postText">テキスト入力</label>
				   
				   <div class="text-area-container">
	               <textarea
	                   id="postText"
	                   name="postText"
	                   rows="5"
	                   placeholder="投稿内容を入力してください">
				   </textarea>
                   <div class="hashtag-area">
	               <button type="button" class="hashtag-button" id="showHashtagInput">
	                   ⊕ ハッシュタグ追加
	               </button>
				   <!-- 最初は非表示 -->

				   <!-- ハッシュタグ入力ポップアップ -->
				   <div class="hashtag-modal" id="hashtagModal" hidden>
				       <div class="hashtag-dialog">
				           <button
				               type="button"
				               class="hashtag-close"
				               id="closeHashtag"
				               aria-label="閉じる">×</button>

				           <h2>ハッシュタグを追加</h2>
				           <label for="hashtagInput">
				               ハッシュタグを入力
				           </label>

				           <div class="hashtag-input-row">
				               <input
				                   type="text"
				                   id="hashtagInput"
				                   placeholder="例：旅行"
				                   maxlength="50">
				           </div>

				           <button type="button" id="addHashtag"
				                   class="hashtag-confirm">
				               追加
				           </button>
				       </div>
				   </div>

	               </div>
				   </div>
				   </div>
	           </section>

	           <!-- 画像追加 -->
	           <section class="section">
	               <h2>画像を追加</h2>

	               <label for="imageInput" class="upload-button">+画像を選択</label>
	               <input
	                   type="file"
	                   id="imageInput"
	                   name="images"
	                   accept="image/*"
	                   multiple
					   hidden
	               >

	               <div id="imagePreview" class="image-list">
	                   <!-- 選択した画像を表示 -->
	               </div>

	              
	           </section>

	           <!-- 音声録音・再生 -->
	           <section class="section">
	               <h2>音声を追加</h2>
               <div class="audio-controls">
	               <button type="button" id="recordButton">
	                   ●録音開始
	               </button>

	               <button type="button" id="stopButton" disabled>
	                   ●録音停止
	               </button>

	             

	               <label for="audioInput" class="audio-Input">+音声を選択</label>
	               <input
	                   type="file"
	                   id="audioInput"
	                   name="audioFiles"
	                   accept="audio/*"
	                   multiple
					   hidden
	               >
				   </div>
				   <p id="recordingStatus">停止中</p>

	               <div id="audioPreview">
	                   <!-- 選択・録音した音声を表示 -->
	               </div>

	              
	           </section>

	       </form>
	   </main>

	   <!-- 下部メニュー -->
	   <nav class="bottom-menu" aria-label="メインメニュー">
	       <a href="search.html" aria-label="検索" title="検索">⌕ </a>
	       <a href="home.html" aria-label="ホーム" title="ホーム">⌂ </a>
	       <a href="mypage.html" aria-label="マイページ" title="マイページ" >👤</a>
	   </nav>
<script>

	   const hashtagModal = document.getElementById("hashtagModal");
	   const hashtagInput = document.getElementById("hashtagInput");
	   const addHashtag = document.getElementById("addHashtag");
	   const closeHashtag = document.getElementById("closeHashtag");
	   const postText = document.getElementById("postText");

	   // 入力枠を表示する関数
	   function openHashtagModal() {
	       hashtagModal.hidden = false;
	       hashtagInput.focus();
		   }
		   // ハッシュタグ追加ボタンを押すと入力枠を開く
		   const showHashtagInput = document.getElementById("showHashtagInput");

		   showHashtagInput.addEventListener("click", function () {
		       openHashtagModal();
		   });
	   

	   // ×で閉じる
	   closeHashtag.addEventListener("click", function () {
	       hashtagModal.hidden = true;
	       hashtagInput.value = "";
	   });

	   // 追加してテキストエリアに反映
	   addHashtag.addEventListener("click", function () {
	       let tag = hashtagInput.value.trim();

	       if (tag === "") {
	           alert("ハッシュタグを入力してください。");
	           hashtagInput.focus();
	           return;
	       }

	       tag = "#" + tag.replace(/^#+/, "");

	       if (tag === "#") {
	           alert("ハッシュタグを入力してください。");
	           return;
	       }

	       const separator =
	           postText.value !== "" &&
	           !postText.value.endsWith("\n")
	               ? "\n"
	               : "";

	       postText.value += separator + tag + " ";

	       hashtagModal.hidden = true;
	       hashtagInput.value = "";
	       postText.focus();
	   });


	   /* ===== 画像処理 ===== */

	   const imageInput = document.getElementById("imageInput");
	   const imagePreview = document.getElementById("imagePreview");

	   let images = [];

	   imageInput.addEventListener("change", function () {
	       for (const file of imageInput.files) {
	           if (!file.type.startsWith("image/")) continue;

	           images.push({
	               file: file,
	               url: URL.createObjectURL(file)
	           });
	       }

	       imageInput.value = "";
	       showImages();
	   });

	   function showImages() {
	       imagePreview.replaceChildren();

	       images.forEach(function (image, index) {
	           const item = document.createElement("div");
	           item.className = "image-item";

	           const img = document.createElement("img");
	           img.src = image.url;
	           img.alt = image.file.name;

	           const remove = document.createElement("button");
	           remove.type = "button";
	           remove.className = "remove-button";
	           remove.textContent = "画像を削除";

	           remove.addEventListener("click", function () {
	               URL.revokeObjectURL(image.url);
	               images.splice(index, 1);
	               showImages();
	           });

	           item.append(img, remove);
	           imagePreview.append(item);
	       });
	   }


	   /* ===== 音声ファイル・録音処理 ===== */

	   const audioInput = document.getElementById("audioInput");
	   const audioPreview = document.getElementById("audioPreview");
	   const recordingStatus = document.getElementById("recordingStatus");
	   const recordButton = document.getElementById("recordButton");
	   const stopButton = document.getElementById("stopButton");

	   let audios = [];
	   let recorder = null;
	   let stream = null;
	   let chunks = [];

	   function addAudio(file) {
	       audios.push({
	           file: file,
	           url: URL.createObjectURL(file)
	       });

	       showAudios();
	   }

	   // 音声ファイルを選択
	   audioInput.addEventListener("change", function () {
	       for (const file of audioInput.files) {
	           if (file.type.startsWith("audio/")) {
	               addAudio(file);
	           }
	       }

	       audioInput.value = "";
	   });

	   // 音声一覧・再生コントロールを表示
	   function showAudios() {
	       audioPreview.replaceChildren();

	       audios.forEach(function (audio, index) {
	           const item = document.createElement("div");
	           item.className = "audio-item";

	           const name = document.createElement("p");
	           name.textContent = audio.file.name;

	           const player = document.createElement("audio");
	           player.src = audio.url;
	           player.controls = true;

	           const remove = document.createElement("button");
	           remove.type = "button";
	           remove.className = "remove-button";
	           remove.textContent = "音声を削除";

	           remove.addEventListener("click", function () {
	               URL.revokeObjectURL(audio.url);
	               audios.splice(index, 1);
	               showAudios();
	           });

	           item.append(name, player, remove);
	           audioPreview.append(item);
	       });
	   }

	   // 録音開始
	   recordButton.addEventListener("click", async function () {
	       if (!navigator.mediaDevices ||
	           !navigator.mediaDevices.getUserMedia ||
	           !window.MediaRecorder) {
	           recordingStatus.textContent =
	               "このブラウザでは録音を利用できません。";
	           return;
	       }

	       try {
	           stream = await navigator.mediaDevices.getUserMedia({
	               audio: true
	           });

	           chunks = [];
	           recorder = new MediaRecorder(stream);

	           recorder.addEventListener("dataavailable", function (event) {
	               if (event.data.size > 0) {
	                   chunks.push(event.data);
	               }
	           });

	           recorder.addEventListener("stop", function () {
	               const blob = new Blob(chunks, {
	                   type: recorder.mimeType || "audio/webm"
	               });

	               const file = new File(
	                   [blob],
	                   "録音_" + Date.now() + ".webm",
	                   { type: blob.type }
	               );

	               addAudio(file);

	               stream.getTracks().forEach(function (track) {
	                   track.stop();
	               });

	               stream = null;
	               recordingStatus.textContent = "録音が完了しました。";
	               recordButton.disabled = false;
	               stopButton.disabled = true;
	           });

	           recorder.start();

	           recordButton.disabled = true;
	           stopButton.disabled = false;
	           recordingStatus.textContent = "録音中です...";
	       } catch (error) {
	           recordingStatus.textContent =
	               "マイクの使用を許可してください。";
	       }
	   });

	   // 録音停止
	   stopButton.addEventListener("click", function () {
	       if (recorder && recorder.state === "recording") {
	           recorder.stop();
	       }
	   });


 </script>
	  
</body>
</html>
